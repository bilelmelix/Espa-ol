<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Espagnol → Français</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #3b82f6;
    --success: #22c55e;
    --error: #ef4444;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 1rem;
  }
  .container { max-width: 650px; margin: 0 auto; }
  header { text-align: center; padding: 1.2rem 0; }
  header h1 { font-size: 1.6rem; }
  header p { color: var(--muted); margin-top: 0.3rem; }

  .word-card {
    background: var(--card);
    border-radius: 14px;
    padding: 1rem 1.1rem;
    margin-bottom: 0.85rem;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.8rem;
    align-items: center;
  }
  @media (max-width: 500px) {
    .word-card { grid-template-columns: 1fr; }
  }
  .spanish {
    font-size: 1.1rem;
    font-weight: 600;
  }
  .spanish small { display: block; font-weight: 400; color: var(--muted); font-size: 0.8rem; }
  input[type="text"] {
    width: 100%;
    background: #334155;
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 0.7rem 0.9rem;
    color: var(--text);
    font-size: 1rem;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  input.correct { border-color: var(--success); background: #16653433; }
  input.wrong { border-color: var(--error); background: #7f1d1d33; }

  .result-text {
    font-size: 0.85rem;
    margin-top: 0.35rem;
    min-height: 1.2em;
  }
  .result-text.ok { color: var(--success); }
  .result-text.ko { color: var(--error); }

  .btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 0.9rem;
    font-size: 1.05rem;
    font-weight: 600;
    width: 100%;
    margin-top: 0.5rem;
    cursor: pointer;
  }
  .btn:hover { background: #2563eb; }
  .btn-secondary { background: #334155; margin-top: 0.6rem; }

  .score {
    text-align: center;
    font-size: 1.8rem;
    font-weight: 700;
    margin: 1rem 0;
  }
  .score span { color: var(--accent); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Quiz Espagnol → Français</h1>
    <p>Écris la traduction en français</p>
  </header>

  <div id="quiz"></div>

  <button class="btn" id="checkBtn">Vérifier les réponses</button>
  <button class="btn btn-secondary hidden" id="resetBtn">Recommencer</button>

  <div id="scoreBox" class="hidden">
    <div class="score">Score : <span id="score"></span></div>
  </div>
</div>

<script>
const vocab = [
  { es: "una polémica", fr: "une polémique" },
  { es: "la portada", fr: "la couverture" },
  { es: "artículo de prensa", fr: "article de presse" },
  { es: "prosperidad", fr: "prospérité" },
  { es: "famoso", fr: "fameux" },
  { es: "desarrollo", fr: "développement" },
  { es: "empleos", fr: "emplois" },
  { es: "trabajos", fr: "travaux" },
  { es: "superpoblación", fr: "surpopulation" },
  { es: "turismo de masa", fr: "tourisme de masse" },
  { es: "el precio", fr: "le prix" },
  { es: "vivienda", fr: "logement" },
  { es: "la contaminación", fr: "la contamination" },
  { es: "el verano", fr: "l'été" },
  { es: "los británicos", fr: "les britanniques" },
  { es: "los franceses", fr: "les français" },
  { es: "los alemanes", fr: "les allemands" },
  { es: "la mayoría", fr: "la majorité" },
  { es: "atracciones", fr: "attractions" },
  { es: "excepción", fr: "exception" },
  { es: "lejos", fr: "loin" },
  { es: "frontera", fr: "frontière" },
  { es: "paraíso", fr: "paradis" }
];

function shuffle(arr) {
  return arr.sort(() => Math.random() - 0.5);
}
let current = shuffle([...vocab]);

function render() {
  const quiz = document.getElementById("quiz");
  quiz.innerHTML = "";
  current.forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "word-card";
    card.innerHTML = `
      <div class="spanish">${item.es}<small>Espagnol</small></div>
      <div>
        <input type="text" data-index="${i}" placeholder="Traduction en français..." autocomplete="off">
        <div class="result-text" id="res-${i}"></div>
      </div>
    `;
    quiz.appendChild(card);
  });
}

function normalize(str) {
  return str.trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/['’]/g, "'");
}

document.getElementById("checkBtn").addEventListener("click", () => {
  let score = 0;
  const inputs = document.querySelectorAll("input[type=text]");
  inputs.forEach(input => {
    const i = input.dataset.index;
    const user = normalize(input.value);
    const correct = normalize(current[i].fr);
    const res = document.getElementById(`res-${i}`);
    input.disabled = true;

    if (user === correct) {
      input.classList.add("correct");
      res.textContent = "Correct !";
      res.className = "result-text ok";
      score++;
    } else {
      input.classList.add("wrong");
      res.textContent = `Correct : ${current[i].fr}`;
      res.className = "result-text ko";
    }
  });

  document.getElementById("score").textContent = `${score} / ${current.length}`;
  document.getElementById("scoreBox").classList.remove("hidden");
  document.getElementById("checkBtn").classList.add("hidden");
  document.getElementById("resetBtn").classList.remove("hidden");
});

document.getElementById("resetBtn").addEventListener("click", () => {
  current = shuffle([...vocab]);
  document.getElementById("scoreBox").classList.add("hidden");
  document.getElementById("checkBtn").classList.remove("hidden");
  document.getElementById("resetBtn").classList.add("hidden");
  render();
});

render();
</script>
</body>
</html>
